name: Build BuscaLocal APK
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: SDK and native toolchain
        run: |
          SDK_DIR="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --channel=3 --list | grep -E "platforms;android-37" || true
          "$SDKMANAGER" --channel=3 --install 'platforms;android-36' 'platforms;android-37.2' 'build-tools;36.0.0' 'ndk;29.0.13113456' 'cmake;3.22.1'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: buscalocal-debug-key-v1
      - name: Preserve debug signing key for future builds
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 3650 -dname "CN=BuscaLocal Debug" -noprompt
          fi
      - run: bash scripts/bootstrap-engine.sh
      - run: sh tests/run.sh
      - run: gradle :app:assembleDebug --no-daemon --stacktrace --max-workers=2
      - name: Verify native libraries and APK integrity
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "versionName='0.3.3'"
          unzip -t app/build/outputs/apk/debug/app-debug.apk
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libai-chat.so'
          unzip -l app/build/outputs/apk/debug/app-debug.apk | grep 'lib/arm64-v8a/libtor.so'
      - name: Preserve ARM64 APK for distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/BuscaLocal-v0.3.3.apk

      - name: Build x86_64 UI smoke APK (not distributed)
        run: gradle :app:assembleDebug -PuiSmoke=true --no-daemon --max-workers=2
      - name: Enable emulator KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch and type on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: bash tests/ui-smoke.sh app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BuscaLocal-v0.3.3-APK
          path: dist/BuscaLocal-v0.3.3.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: BuscaLocal-v0.3.3-UI-diagnostics
          path: |
            ui-before.xml
            ui-after.xml
            ui-closed.xml
            ui-smoke-log.txt
            ui-smoke.png
          if-no-files-found: ignore
